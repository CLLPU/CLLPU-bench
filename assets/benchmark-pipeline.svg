<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="200" viewBox="0 0 1500 200" role="img" aria-labelledby="title description">
  <title id="title">CLLPU benchmark pipeline</title>
  <desc id="description">Seven stages from goal-guided topic-pair construction to screening and multilingual evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; }
      .arrow { stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .title { fill: #172033; font: 600 13px Inter, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .label { fill: #334155; font: 12.5px Inter, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <line class="arrow" x1="190" y1="100" x2="215" y2="100"/>
  <line class="arrow" x1="425" y1="100" x2="450" y2="100"/>
  <line class="arrow" x1="630" y1="100" x2="655" y2="100"/>
  <line class="arrow" x1="825" y1="100" x2="850" y2="100"/>
  <line class="arrow" x1="1010" y1="100" x2="1035" y2="100"/>
  <line class="arrow" x1="1235" y1="100" x2="1260" y2="100"/>

  <rect class="box" x="20" y="60" width="170" height="80" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="105" y="91">Stage 1</text>
  <text class="label" x="105" y="115">Goal-guided topic pairs</text>

  <rect class="box" x="215" y="60" width="210" height="80" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="320" y="91">Stage 2</text>
  <text class="label" x="320" y="115">Knowledge units + English QA</text>

  <rect class="box" x="450" y="60" width="180" height="80" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="540" y="91">Stage 3</text>
  <text class="label" x="540" y="115">Parallel multilingual QA</text>

  <rect class="box" x="655" y="60" width="170" height="80" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="740" y="96">Frozen runtime JSONL</text>

  <rect class="box" x="850" y="60" width="160" height="80" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text class="title" x="930" y="96">Target + retain SFT</text>

  <rect class="box" x="1035" y="60" width="200" height="80" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text class="title" x="1135" y="91">Source-language</text>
  <text class="label" x="1135" y="115">unlearning</text>

  <rect class="box" x="1260" y="60" width="220" height="80" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text class="title" x="1370" y="91">Screening + multilingual</text>
  <text class="label" x="1370" y="115">evaluation</text>
</svg>
