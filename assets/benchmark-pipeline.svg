<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="240" viewBox="0 0 1500 240" role="img" aria-labelledby="title description">
  <title id="title">CLLPU benchmark pipeline</title>
  <desc id="description">Seven stages from goal-guided topic-pair construction to screening and multilingual evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { stroke-width: 1.75; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .title { fill: #172033; font: 600 20px Inter, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .label { fill: #334155; font: 18px Inter, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <line class="arrow" x1="201" y1="120" x2="222" y2="120"/>
  <line class="arrow" x1="416" y1="120" x2="437" y2="120"/>
  <line class="arrow" x1="631" y1="120" x2="652" y2="120"/>
  <line class="arrow" x1="846" y1="120" x2="867" y2="120"/>
  <line class="arrow" x1="1061" y1="120" x2="1082" y2="120"/>
  <line class="arrow" x1="1276" y1="120" x2="1297" y2="120"/>

  <rect class="box" x="10" y="60" width="190" height="120" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="105" y="101">Stage 1</text>
  <text class="label" x="105" y="134">Goal-guided</text>
  <text class="label" x="105" y="158">topic pairs</text>

  <rect class="box" x="225" y="60" width="190" height="120" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="320" y="101">Stage 2</text>
  <text class="label" x="320" y="134">Knowledge units +</text>
  <text class="label" x="320" y="158">English QA</text>

  <rect class="box" x="440" y="60" width="190" height="120" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="535" y="101">Stage 3</text>
  <text class="label" x="535" y="134">Parallel</text>
  <text class="label" x="535" y="158">multilingual QA</text>

  <rect class="box" x="655" y="60" width="190" height="120" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text class="title" x="750" y="110">Frozen runtime</text>
  <text class="label" x="750" y="143">JSONL</text>

  <rect class="box" x="870" y="60" width="190" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text class="title" x="965" y="110">Target + retain</text>
  <text class="label" x="965" y="143">SFT</text>

  <rect class="box" x="1085" y="60" width="190" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text class="title" x="1180" y="110">Source-language</text>
  <text class="label" x="1180" y="143">unlearning</text>

  <rect class="box" x="1300" y="60" width="190" height="120" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text class="title" x="1395" y="101">Screening +</text>
  <text class="label" x="1395" y="134">multilingual</text>
  <text class="label" x="1395" y="158">evaluation</text>
</svg>
